<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YUBISHO - Phase 1 Engine v2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f3efe6;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #debug-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff66;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 100;
            line-height: 1.4;
        }
        #secret-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="yubisho-canvas"></canvas>
    <div id="debug-overlay">
        FPS: <span id="db-fps">0</span><br>
        Speed: <span id="db-speed">0.00</span><br>
        Ink: <span id="db-ink">0.00</span><br>
        Dryness: <span id="db-dry">0.00</span>
    </div>
    <div id="secret-trigger"></div>
</div>

<script>
const Config = {
    DEBUG: false,
    BASE_RADIUS: 16,
    MAX_RADIUS_BONUS: 24,
    INK_CONSUMPTION: 0.003,
    INK_RECOVERY: 0.05
};

// 簡易ノイズ生成
function pseudoNoise(x, y) {
    const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
}

class Paper {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.textureCanvas = document.createElement('canvas');
        this.fiberMaskCanvas = document.createElement('canvas');
    }

    resize(w, h) {
        this.canvas.width = w;
        this.canvas.height = h;
        this.textureCanvas.width = w;
        this.textureCanvas.height = h;
        this.fiberMaskCanvas.width = w;
        this.fiberMaskCanvas.height = h;
        this.generateTexture(w, h);
    }

    generateTexture(w, h) {
        const tCtx = this.textureCanvas.getContext('2d');
        const mCtx = this.fiberMaskCanvas.getContext('2d');

        // ベース和紙色
        tCtx.fillStyle = '#f3efe6';
        tCtx.fillRect(0, 0, w, h);

        // 紙の繊維ノイズ
        const imgData = tCtx.getImageData(0, 0, w, h);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            const n = (Math.random() - 0.5) * 14;
            data[i]     = Math.min(255, Math.max(0, data[i] + n));
            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + n));
            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + n));
        }
        tCtx.putImageData(imgData, 0, 0);

        // 掠れ打ち抜き用の高コントラスト繊維マスクの生成
        mCtx.fillStyle = '#000';
        mCtx.fillRect(0, 0, w, h);
        mCtx.fillStyle = '#fff';
        
        for (let i = 0; i < w; i += 3) {
            for (let j = 0; j < h; j += 3) {
                if (pseudoNoise(i * 0.1, j * 0.1) > 0.62) {
                    mCtx.fillRect(i, j, 2, 2);
                }
            }
        }

        this.render();
    }

    render() {
        this.ctx.drawImage(this.textureCanvas, 0, 0);
    }
}

class MotionAnalyzer {
    constructor() {
        this.last = null;
    }

    reset() { this.last = null; }

    analyze(sample) {
        if (!this.last || sample.phase === 'start') {
            this.last = { ...sample, speed: 0, dir: 0, r: sample.radius };
            return { ...sample, speed: 0, dir: 0, r: sample.radius };
        }

        const dt = Math.max(1, sample.time - this.last.time);
        const dx = sample.x - this.last.x;
        const dy = sample.y - this.last.y;
        const dist = Math.hypot(dx, dy);
        const speed = dist / dt;
        const dir = Math.atan2(dy, dx);
        
        const r = Math.min(Config.BASE_RADIUS + Config.MAX_RADIUS_BONUS, 
                   Math.max(6, sample.radius));

        const res = { ...sample, speed, dir, r, dx, dy, dist };
        this.last = res;
        return res;
    }
}

class InkEngine {
    constructor(ctx, paper) {
        this.ctx = ctx;
        this.paper = paper;
        this.ink = 1.0;
        this.lastPt = null;
    }

    reset() {
        this.ink = 1.0;
        this.lastPt = null;
    }

    draw(m) {
        // 墨量の計算
        if (m.phase === 'start') {
            this.ink = 1.0;
        } else if (m.speed < 0.05) {
            this.ink = Math.min(1.0, this.ink + Config.INK_RECOVERY);
        } else {
            this.ink = Math.max(0.05, this.ink - m.speed * Config.INK_CONSUMPTION);
        }

        const dryness = Math.min(0.95, Math.max(0, (m.speed * 0.4) - (this.ink * 0.7)));
        const density = Math.max(0.15, this.ink * (1.1 - Math.min(0.7, m.speed * 0.2)));

        if (m.phase === 'start' || !this.lastPt) {
            this.lastPt = { x: m.x, y: m.y, r: m.r * 0.4, dir: m.dir };
            return { ink: this.ink, dryness };
        }

        // 収筆（抜け）の処理
        let targetX = m.x;
        let targetY = m.y;
        let targetR = m.r;

        if (m.phase === 'end') {
            const exitDist = Math.min(25, m.speed * 12);
            targetX += Math.cos(m.dir) * exitDist;
            targetY += Math.sin(m.dir) * exitDist;
            targetR = 1.0; // 先端を研ぎ澄ます
        }

        // 補間ステップ描画（リボン接続）
        const dx = targetX - this.lastPt.x;
        const dy = targetY - this.lastPt.y;
        const dist = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.ceil(dist / 2));

        for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const cx = this.lastPt.x + dx * t;
            const cy = this.lastPt.y + dy * t;
            const cr = this.lastPt.r + (targetR - this.lastPt.r) * t;
            const angle = m.dir + Math.PI / 2; // 接線方向

            this.renderBrushSegment(cx, cy, cr, angle, density, dryness);
        }

        this.lastPt = { x: targetX, y: targetY, r: targetR, dir: m.dir };
        return { ink: this.ink, dryness };
    }

    renderBrushSegment(x, y, r, angle, density, dryness) {
        const ctx = this.ctx;
        ctx.save();

        // 1. 滲み（外周の非常に薄い拡散）
        if (dryness < 0.3) {
            ctx.fillStyle = `rgba(15, 15, 15, ${density * 0.08})`;
            ctx.beginPath();
            ctx.arc(x + (Math.random() - 0.5) * 2, y + (Math.random() - 0.5) * 2, r * 1.35, 0, Math.PI * 2);
            ctx.fill();
        }

        // 2. 墨核（非円形・不規則ポリゴン）
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        // 筆の穂先（線片）の両端座標を求める
        const p1x = x + cos * r * (1 + (Math.random() - 0.5) * 0.3);
        const p1y = y + sin * r * (1 + (Math.random() - 0.5) * 0.3);
        const p2x = x - cos * r * (1 + (Math.random() - 0.5) * 0.3);
        const p2y = y - sin * r * (1 + (Math.random() - 0.5) * 0.3);

        ctx.fillStyle = `rgba(12, 12, 14, ${density})`;
        ctx.beginPath();
        ctx.moveTo(p1x, p1y);
        ctx.lineTo(p2x, p2y);
        ctx.lineTo(p2x + (Math.random() - 0.5) * 4, p2y + (Math.random() - 0.5) * 4);
        ctx.lineTo(p1x + (Math.random() - 0.5) * 4, p1y + (Math.random() - 0.5) * 4);
        ctx.closePath();
        ctx.fill();

        // 3. 掠れ（紙繊維マスクによるリアル打ち抜き）
        if (dryness > 0.15) {
            ctx.globalCompositeOperation = 'destination-out';
            const cutAlpha = Math.min(0.85, (dryness - 0.15) * 1.4);
            ctx.fillStyle = `rgba(0, 0, 0, ${cutAlpha})`;

            // 繊維パターンに基いて削る
            const maskSize = r * 2.2;
            ctx.drawImage(
                this.paper.fiberMaskCanvas,
                Math.max(0, x - maskSize / 2), Math.max(0, y - maskSize / 2), maskSize, maskSize,
                x - maskSize / 2, y - maskSize / 2, maskSize, maskSize
            );
        }

        ctx.restore();
    }
}

class App {
    constructor() {
        this.canvas = document.getElementById('yubisho-canvas');
        this.paper = new Paper(this.canvas);
        this.analyzer = new MotionAnalyzer();
        this.engine = new InkEngine(this.paper.ctx, this.paper);

        this.init();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());

        const handleSample = (x, y, radius, phase) => {
            const sample = { x, y, radius, phase, time: performance.now() };
            if (phase === 'start') {
                this.analyzer.reset();
                this.engine.reset();
            }
            const motion = this.analyzer.analyze(sample);
            const status = this.engine.draw(motion);

            if (Config.DEBUG) {
                document.getElementById('db-speed').textContent = motion.speed.toFixed(2);
                document.getElementById('db-ink').textContent = status.ink.toFixed(2);
                document.getElementById('db-dry').textContent = status.dryness.toFixed(2);
            }
        };

        // Touch Events
        let activeId = null;
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.changedTouches[0];
            activeId = t.identifier;
            handleSample(t.clientX, t.clientY, t.majorRadius || 14, 'start');
        }, { passive: false });

        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === activeId) {
                    handleSample(t.clientX, t.clientY, t.majorRadius || 14, 'move');
                    break;
                }
            }
        }, { passive: false });

        const handleTouchEnd = (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === activeId) {
                    handleSample(t.clientX, t.clientY, t.majorRadius || 14, 'end');
                    activeId = null;
                    break;
                }
            }
        };
        this.canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        this.canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

        // Mouse Fallback
        let isMouseDown = false;
        this.canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            handleSample(e.clientX, e.clientY, 14, 'start');
        });
        this.canvas.addEventListener('mousemove', (e) => {
            if (isMouseDown) handleSample(e.clientX, e.clientY, 14, 'move');
        });
        window.addEventListener('mouseup', (e) => {
            if (isMouseDown) {
                isMouseDown = false;
                handleSample(e.clientX, e.clientY, 14, 'end');
            }
        });

        // Debug Trigger
        let taps = 0, timer = null;
        document.getElementById('secret-trigger').addEventListener('click', () => {
            taps++;
            clearTimeout(timer);
            if (taps >= 3) {
                Config.DEBUG = !Config.DEBUG;
                document.getElementById('debug-overlay').style.display = Config.DEBUG ? 'block' : 'none';
                taps = 0;
            } else {
                timer = setTimeout(() => { taps = 0; }, 500);
            }
        });
    }

    resize() {
        this.paper.resize(window.innerWidth, window.innerHeight);
    }
}

window.addEventListener('DOMContentLoaded', () => { new App(); });
</script>
</body>
</html>
